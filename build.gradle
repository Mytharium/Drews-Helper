plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
        content {
            includeGroupByRegex("net\\.runelite.*")
        }
    }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.drewshelper.DrewsHelperPluginTest'

// Route B lives in its own source set on purpose: the cache-decoding dependency is a
// build-time tool only and must never reach the shipped plugin jar or the test suite.
sourceSets {
    cachetools {
        java.srcDir 'src/cachetools/java'
        // The row generator reads our own collision map to sanity-check candidate crossings
        // before writing review-only rows, so it needs main on the classpath. Still one-way:
        // nothing in main can see cachetools, so the cache dependency stays out of the jar.
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation 'junit:junit:4.12'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion

    cachetoolsImplementation group: 'net.runelite', name: 'cache', version: runeLiteVersion
}

group = 'com.drewshelper'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = pluginMainClass
    jvmArgs '-ea'
    args '--developer-mode', '--debug'
}

tasks.register('shadowJar', Jar) {
    dependsOn configurations.testRuntimeClasspath
    manifest {
        attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from sourceSets.test.output
    from {
        configurations.testRuntimeClasspath.collect { file ->
            file.isDirectory() ? file : zipTree(file)
        }
    }
    exclude 'META-INF/INDEX.LIST'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude '**/module-info.class'
}

// Route B - decode the OSRS game cache and report gates/doors that have no transport row.
// Confirmed 2026-08-10: map archives decode with ZERO xtea keys, so no key file is needed.
tasks.register('dumpAccessPoints', JavaExec) {
    group = 'drewshelper'
    description = 'Decode the OSRS game cache and report gates/doors with no transport row.'
    classpath = sourceSets.cachetools.runtimeClasspath
    mainClass = 'com.drewshelper.cachetools.CacheAccessPointDumper'
}

// To-do #2 - derive candidate transport rows from the cache dump.
// Writes tools/cache-derived-gates.tsv. Does NOT touch transport-overrides.tsv.
tasks.register('generateTransportRows', JavaExec) {
    group = 'drewshelper'
    description = 'Turn wall-mounted access points into reviewable candidate transport rows.'
    classpath = sourceSets.cachetools.runtimeClasspath
    mainClass = 'com.drewshelper.cachetools.AccessPointRowGenerator'
}

tasks.register('classifyProofEdges', JavaExec) {
    group = 'drewshelper'
    description = 'Classify live mismatch proof edges against OSRS cache wall placements.'
    classpath = sourceSets.cachetools.runtimeClasspath
    mainClass = 'com.drewshelper.cachetools.ProofEdgeClassifier'
}

tasks.register('probeLocTypeShapes', JavaExec) {
    group = 'drewshelper'
    description = 'Measure locType/orientation wall edge blocking against the shipped collision map.'
    classpath = sourceSets.cachetools.runtimeClasspath
    mainClass = 'com.drewshelper.cachetools.LocTypeShapeProbe'
}

tasks.register('buildCollisionMapV2', JavaExec) {
    group = 'drewshelper'
    description = 'Build a v2 collision map from the OSRS cache and compare it to proof edges.'
    classpath = sourceSets.cachetools.runtimeClasspath
    mainClass = 'com.drewshelper.cachetools.CollisionMapBuilder'
}
